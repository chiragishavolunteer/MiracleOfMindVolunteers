    for (let i = 0; i < 50 && flushing; i++) await new Promise(r => setTimeout(r, 100));
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(timer); flush(); } });
  window.addEventListener('pagehide', () => { clearTimeout(timer); flush(); });
  const schedule = () => { if (!ready) { chip('NOT READY ' + seen.size + '/' + ALL.length + ' - change not saved'); return; } clearTimeout(timer); timer = setTimeout(flush, 400); };

  // ---- cloud -> local ----
  function applyDoc(c, id, s, removed) {
    if (isList(c)) {
      const i = store[c].findIndex(x => x.id === id);
      if (removed) { if (i >= 0) store[c].splice(i, 1); delete plain[c][id]; return; }
      if (i >= 0 && plain[c][id] !== undefined && JSON.stringify(store[c][i]) !== plain[c][id]) return; // unsent local edit wins
      const v = dec(s); plain[c][id] = JSON.stringify(v);
      if (i >= 0) store[c][i] = v; else store[c].push(v);
    } else {
      if (removed) { delete store[c][id]; delete plain[c][id]; return; }
      if (id in store[c] && plain[c][id] !== undefined && JSON.stringify(store[c][id]) !== plain[c][id]) return;
      const v = dec(s); plain[c][id] = JSON.stringify(v); store[c][id] = v;
    }
  }
  const SEED = /^(u|i|s|c|p|cm|ag)\d{1,2}$/;
  function purgeDemo() {
    store.users = store.users.filter(u => u.id.indexOf('fb_') === 0);
    ['institutions', 'sessions', 'posts', 'comments', 'agendas'].forEach(c => { store[c] = store[c].filter(x => !SEED.test(x.id)); });
    store.notifications = store.notifications.filter(n => n.toUserId.indexOf('fb_') === 0);
    Object.keys(store.chatRead).forEach(k => { if (/^u\d/.test(k)) delete store.chatRead[k]; });
  }
  const PRESET_KEY = '__seed:wmhd2026';
  const PRESETS = [
    ['mnr', 'MNR International School, Palaspe', 'Panvel', 'Village Palaspe, Mumbai-Goa Highway, Taluka Panvel, Navi Mumbai, Dist. Raigad, Maharashtra - 410206', 'https://www.google.com/maps/search/?api=1&query=MNR+International+School+Palaspe+Panvel', 'done', 'CBSE senior secondary school (affiliation 1130822). Website: mnrisp.mnrindia.org'],
    ['tata', 'Tata STRIVE Skill Development Centre, Nerul', 'Other', 'MK Shah Exports Building / TTC Industrial Area, MIDC, Near LP / Uran Phata area, Nerul, Navi Mumbai, Maharashtra - 400706', 'https://www.google.com/maps/search/?api=1&query=Tata+STRIVE+Skill+Development+Centre+Nerul+Navi+Mumbai', 'done', 'Flagship skilling centre (vocational training, placements). Part of Tata Community Initiatives Trust.'],
    ['kle', "K.L.E. Society's Science and Commerce College, Kalamboli", 'Panvel', 'Plot No. 29, Sector-1, Kalamboli, Navi Mumbai - 410218, Maharashtra', 'https://www.google.com/maps/search/?api=1&query=KLE+Society+Science+and+Commerce+College+Kalamboli', 'done', 'Affiliated to University of Mumbai. KLE Law College is at the same campus. Website: klessccmumbai.edu.in'],
    ['laxmi', 'Laxmi Eye Hospital & Institute, Panvel', 'Panvel', 'Hamid Mulla Road (Old Uran Road), Old Panvel, Panvel, Navi Mumbai - 410206, Maharashtra', 'https://www.google.com/maps/search/?api=1&query=Laxmi+Eye+Institute+Panvel', 'scheduled', 'Super-specialty eye hospital/institute with branches also in Kharghar, Kamothe, Dombivli. Website: laxmieye.org'],
    ['infinity', 'Infinity Foundation (Navi Mumbai)', 'Kharghar', 'Navi Mumbai, Maharashtra (active in Kharghar/Panvel area; exact office address not publicly listed)', 'https://www.google.com/maps/search/?api=1&query=Infinity+Foundation+Navi+Mumbai', 'scheduled', 'Youth/NGO focused on child welfare and education. Website: infinitymaharashtra.in'],
    ['ckt', 'Changu Kana Thakur Arts, Commerce and Science College, New Panvel', 'Panvel', 'Plot No. 1, Sector-11, Khanda Colony, New Panvel, Navi Mumbai, Dist. Raigad - 410206, Maharashtra', 'https://www.google.com/maps/search/?api=1&query=Changu+Kana+Thakur+College+New+Panvel', 'yet', 'Affiliated to University of Mumbai, NAAC A++. Website: ckthakurcollege.net'],
    ['csmu', 'Chhatrapati Shivaji Maharaj University (CSMU)', 'Panvel', 'Near Shedung Toll Plaza, Old Mumbai-Pune Highway, Panvel, Navi Mumbai, Maharashtra - 410206', 'https://www.google.com/maps/search/?api=1&query=Chhatrapati+Shivaji+Maharaj+University+Panvel', 'yet', 'Private university (est. 2018), multi-disciplinary. Website: csmu.ac.in'],
    ['klelaw', "KLE Society's KLE College of Law, Navi Mumbai", 'Panvel', '4th Floor, Plot No. 29, Sector-1, Kalamboli, Panvel, Navi Mumbai - 410218, Maharashtra', 'https://www.google.com/maps/search/?api=1&query=KLE+College+of+Law+Kalamboli+Navi+Mumbai', 'yet', 'Affiliated to University of Mumbai, BCI approved. Shares campus with KLE Science & Commerce College. Website: klecollegeoflawmumbai.edu.in'],
    ['nmims', "SVKM's NMIMS Navi Mumbai Campus", 'Kharghar', 'Plot No. 2, Sector-33, Near Pethapada Metro Station, Kharghar, Navi Mumbai - 410210, Maharashtra', 'https://www.google.com/maps/search/?api=1&query=NMIMS+Navi+Mumbai+Kharghar', 'yet', 'Deemed university campus (est. 2017), multi-school. Website: navimumbai.nmims.edu'],
    ['acpatil', 'A.C. Patil College of Engineering', 'Kharghar', 'Plot No. 17, Sector-4, Kharghar, Navi Mumbai - 410210, Maharashtra', 'https://www.google.com/maps/search/?api=1&query=AC+Patil+College+of+Engineering+Kharghar', 'yet', 'Affiliated to University of Mumbai, AICTE approved engineering college. Website: acpce.ac.in']
  ];
  const PLABEL = { done: 'Done', scheduled: 'Scheduled', yet: 'Yet to schedule' };
  function seedPresets() {
    if (store.chatRead[PRESET_KEY]) return;
    const now = Date.now();
    PRESETS.forEach(p => {
      const id = 'pre_' + p[0];
      if (store.institutions.some(i => i.id === id)) return;
      const adv = p[5] !== 'yet', t = i => adv ? now - (4 - i) * 1000 : null;
      store.institutions.push({ id, name: p[1], area: p[2], address: p[3], mapLink: p[4], contacts: [],
        notes: { text: 'WMHD 2026 status: ' + PLABEL[p[5]] + '. ' + p[6], by: null, at: now },
        manualStages: { visitedAt: t(0), permissionAt: t(1), formReceivedAt: t(2), formApprovedAt: t(3) }, stageBy: {}, declined: null, createdBy: null, createdAt: now,
        history: [{ at: now, by: null, text: 'Added institution' }] });
    });
    store.chatRead[PRESET_KEY] = now;
  }
  function onReady() { purgeDemo(); seedPresets(); try { API.syncReminders(); } catch (e) {} if (window.finishLoading) window.finishLoading(); }
  let rt = null;
  const repaint = () => { clearTimeout(rt); rt = setTimeout(() => { try { _render(); } catch (e) { console.error(e); } }, 150); };

  function listen(c, meId, meObj) {
    unsubs.push(db.collection(c).onSnapshot(snap => {
      const first = !seen.has(c);
      if (c === 'meta') {
        snap.forEach(d => { const n = d.data().agendaSeq; if (typeof n === 'number' && n > store.agendaSeq) store.agendaSeq = n; lastSeq = store.agendaSeq; });
      } else if (c === 'images') {
        let got = false;
        snap.docChanges().forEach(ch => { if (ch.type !== 'removed') { const v = ch.doc.data().d; imgs.set(ch.doc.id, v); urlId.set(v, ch.doc.id); got = true; } });
        if (got && ready) for (const k of LISTS.concat(MAPS)) for (const id of Object.keys(raw[k] || {})) if (raw[k][id].indexOf('fbimg:') >= 0) { plain[k][id] = undefined; applyDoc(k, id, raw[k][id], false); }
      } else {
        if (first) { if (isList(c)) store[c] = []; else store[c] = {}; plain[c] = {}; raw[c] = {}; }
        snap.docChanges().forEach(ch => {
          if (!first && ch.doc.metadata.hasPendingWrites) return;
          const id = ch.doc.id;
          try {
            if (ch.type === 'removed') { delete raw[c][id]; applyDoc(c, id, null, true); }
            else {
              // docs not written by this app's sync (e.g. the sign-up profile doc) have no "d" field: skip them
              const dd = ch.doc.data() && ch.doc.data().d;
              if (typeof dd !== 'string') return;
              const sk = c + '/' + id;
              if (sentAll[sk] && sentAll[sk].has(dd) && lastSent[sk] !== dd) return;
              raw[c][id] = dd; applyDoc(c, id, dd, false);
            }
          } catch (err) { console.warn('Skipped unreadable doc', c, id, err && err.message); }
        });
        if (c === 'users' && meObj && !store.users.find(x => x.id === meId)) store.users.push(meObj);
      }
      if (first) { seen.add(c); chip('connecting ' + seen.size + '/' + ALL.length); if (seen.size === ALL.length) { ready = true; if (!blocked.size) syncErr(null); chip('connected'); onReady(); schedule(); } }
      if (ready) repaint();
    }, e => {
      console.error(c, e); blocked.add(c);
      syncErr('Firestore rules block the "' + c + '" collection (' + (e.code || 'error') + '). Allow it in your Firestore rules.');
      chip('BLOCKED');
      if (!seen.has(c)) { seen.add(c); if (seen.size === ALL.length && !ready) { ready = true; chip('connected'); onReady(); schedule(); } }
      toast(e.code === 'permission-denied' ? 'Database access blocked. Check your Firestore rules.' : 'Database error: ' + e.message.slice(0, 80), 5000);
    }));
  }

  async function start(user) {
    if (started) return; started = true;
    const meId = 'fb_' + user.uid, meObj = store.users.find(x => x.id === meId);
    const meta = await db.collection('meta').doc('app').get();
    if (!meta.exists) {            // first ever sign-in: upload the starter data once
      if (meObj) meObj.role = 'coordinator';
      for (const c of LISTS.concat(MAPS)) plain[c] = {};
      ready = true; lastSeq = null; await flush(); ready = false;
    }
    LISTS.concat(MAPS).forEach(c => { plain[c] = plain[c] || {}; raw[c] = raw[c] || {}; });
    ALL.forEach(c => listen(c, meId, meObj));
    setTimeout(() => { if (started && !ready) { if (window.finishLoading) window.finishLoading(); } if (started && !ready) syncErr('Could not finish connecting to the database. Check that Firestore is created and its rules allow signed-in users.'); }, 12000);
  }
  function stop() { blocked.clear(); unsubs.forEach(u => u()); unsubs = []; seen = new Set(); ready = false; started = false; plain = {}; raw = {}; }

  auth.onAuthStateChanged(user => {
    if (!user) { stop(); chip('signed out'); return; }
    chip('signed in, starting');
    start(user).catch(e => { started = false; console.error(e); syncErr(e); toast('Could not reach the database: ' + e.message.slice(0, 80), 5000); });
  });

  // save after every screen update
  const _render = render;
  render = function () { _render.apply(this, arguments); schedule(); };

  // a reset would now wipe the shared database for everyone, so it is switched off
  API.resetDemo = function () { return { ok: false, error: 'Reset is turned off now that the app uses the live database.' }; };
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<script>
(() => {
  const gate = document.getElementById('welcome-gate');
  if (!gate) return;
  const mm = q => window.matchMedia && matchMedia(q).matches;
  const inApp = mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') || mm('(display-mode: minimal-ui)') || navigator.standalone === true || /[?&]source=app\b/.test(location.search);
  let skipped = false; try { skipped = sessionStorage.getItem('mv-browser') === '1'; } catch (_) {}
  if (inApp || skipped) return;                       // installed app (or "continue in browser" chosen): go straight to login
  const $ = id => document.getElementById(id), btn = $('gate-install'), help = $('gate-help');
  let deferred = null;
  gate.hidden = false; btn.focus();
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const done = () => {
    $('gate-title').innerHTML = 'Installed! <span class="hl">Open Miracle Volunteers from your home screen</span>';
    $('gate-sub').textContent = 'You can close this page and sign in inside the app.'; $('gate-skip').hidden = true;
    btn.hidden = true; help.hidden = true;
  };
  gate.addEventListener('keydown', e => {            // keep Tab focus inside the gate (login form sits behind it)
    if (e.key !== 'Tab') return;
    const f = [...gate.querySelectorAll('button')].filter(b => !b.hidden && b.offsetParent !== null);
    if (!f.length) { e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!gate.contains(a)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', () => { deferred = null; done(); });
  btn.addEventListener('click', async () => {
    if (deferred) {
      deferred.prompt();
      let r = null; try { r = await deferred.userChoice; } catch (_) {}
      deferred = null;
      if (r && r.outcome === 'accepted') done();
      else { help.textContent = 'No problem. Tap "Install the app" again whenever you are ready.'; help.hidden = false; }
      return;
    }
    help.textContent = isIos
      ? 'On iPhone: tap the Share button, then "Add to Home Screen".'
      : 'Open your browser menu (the three dots) and tap "Install app" or "Add to Home screen".';
    help.hidden = false;
  });
  $('gate-skip').addEventListener('click', () => { try { sessionStorage.setItem('mv-browser', '1'); } catch (_) {} gate.hidden = true; });
})();
</script>
