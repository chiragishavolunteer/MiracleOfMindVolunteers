<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Miracle Volunteers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sessions, schools and goals for the Miracle Volunteers team.">
<meta name="theme-color" content="#FAF4ED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a single phone column with a fixed bottom tab bar (Posts, Sessions, Track, and Control for coordinators). Detail screens are drill-ins with a Back button. */
/* Style: neo-brutalism base (thick ink outlines, hard offset shadows), bento tiles, bubble/pill shapes on tappable things, soft calm cards for the Posts feed. */
/* Palette (light only): warm cream ground, dark brown ink, orange-red for primary actions, mustard yellow for highlights, and a separate clear red used ONLY for "urgent / needs volunteers" and destructive confirmation.  */
:root {
  --bg: #FAF4ED;
  --surface: #FFFCF8;
  --ink: #342D45;
  --muted: #6B627A;
  --line: #E6DCD0;
  --edge: #342D45;
  --shadow-c: #342D45;
  --accent: #342D45;
  --accent-ink: #FAF4ED;
  --accent-soft: #F4D3C9;
  --peach: #E8AFA0;
  --sage: #91A99A;
  --sage-soft: #DCE6DF;
  --yellow: #E7C85B;
  --yellow-ink: #342D45;
  --yellow-soft: #F6EBC0;
  --link: #5B3F86;
  --warn: #6B4A00;
  --warn-soft: #F6EBC0;
  --info: #3F5A4B;
  --info-soft: #DCE6DF;
  --ok: #FAF4ED;
  --ok-soft: #342D45;
  --red: #C8261B;
  --red-soft: #FBD9D4;
  --red-text: #9C1B12;
  --red-ink: #ffffff;
  --sh: 6px 6px 0 var(--shadow-c);
  --sh-sm: 3px 3px 0 var(--shadow-c);
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --text: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--text); padding-inline: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }

.app { width: 100%; max-width: 430px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; padding-block: calc(16px + env(safe-area-inset-top, 0px)) 10px; position: sticky; top: 0; background: var(--bg); z-index: 5; isolation: isolate; padding-bottom: 14px; }
.topbar::before { content: ""; position: absolute; top: 0; bottom: 0; left: -16px; right: -16px; background: var(--bg); z-index: -1; }
.topbar h1 { font: 800 28px/1.1 var(--display); margin: 0; letter-spacing: -0.02em; flex: 1; min-width: 0; text-wrap: balance; }
.icon-btn { background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; width: 44px; height: 44px; display: grid; place-items: center; flex: none; box-shadow: var(--sh-sm); position: relative; padding: 0; }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.top-menu { position: absolute; top: calc(100% - 6px); right: 0; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 2px solid var(--edge); border-radius: 22px; box-shadow: var(--sh-sm); z-index: 30; }
.top-menu[hidden] { display: none; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ag-ring { position: relative; width: 48px; height: 48px; flex: none; padding: 0; background: var(--surface); border: 0; border-radius: 999px; display: grid; place-items: center; }
.ag-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ag-ring circle { fill: none; stroke-width: 4; }
.ag-ring .t { stroke: var(--line); }
.ag-ring .f { stroke: var(--accent); stroke-linecap: round; }
.ag-ring span { position: relative; font: 800 9px/1 var(--display); color: var(--ink); letter-spacing: -0.01em; }
.ag-ring:active { transform: translate(1px, 1px); }
.session.tappable { cursor: pointer; }
.ctl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 12px; padding-bottom: 12px; }
.ctl-circle { display: grid; justify-items: center; gap: 8px; background: none; border: 0; padding: 0; min-height: 44px; text-align: center; animation: ctlPop .45s cubic-bezier(.34,1.56,.64,1) both; animation-delay: calc(var(--i) * 60ms); }
.ctl-circle .disc { position: relative; width: 104px; height: 104px; border-radius: 999px; background: var(--c); border: 2.5px solid var(--edge); box-shadow: var(--sh); display: grid; place-items: center; transition: transform .15s; }
.ctl-circle .disc::after { content: ""; position: absolute; inset: 7px; border-radius: 999px; border: 2px dashed color-mix(in srgb, var(--edge) 45%, transparent); }
.ctl-circle:hover .disc { transform: rotate(-6deg) scale(1.04); }
.ctl-circle:active .disc { transform: translate(3px, 3px); box-shadow: none; }
.ctl-circle svg { width: 38px; height: 38px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ctl-circle .lbl { font: 800 15px var(--display); color: var(--ink); }
.ctl-circle .sub { font-size: 12px; color: var(--muted); margin-top: -6px; max-width: 150px; }
.ctl-circle .count { top: -2px; right: -2px; }
@keyframes ctlPop { from { transform: scale(.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ctl-circle { animation: none; } .ctl-circle:hover .disc { transform: none; } }
.count { position: absolute; top: -7px; right: -7px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--edge); font: 800 11px/18px var(--display); text-align: center; }
.back { font-size: 14px; color: var(--link); background: none; border: 0; padding: 0; min-height: 44px; font-weight: 700; }
.me { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); color: var(--yellow-ink); border: 2px solid var(--edge); box-shadow: var(--sh-sm); font: 800 14px var(--display); display: grid; place-items: center; flex: none; padding: 0; }
.me:active { transform: translate(2px, 2px); box-shadow: none; }

.screen { padding-block: 8px 24px; }
.eyebrow { font: 600 11px/1.2 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.sticker { display: inline-block; background: var(--yellow); color: var(--yellow-ink); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 12px; transform: rotate(-2deg); box-shadow: var(--sh-sm); font: 700 11px/1.2 var(--text); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.sticker.alt { background: var(--accent); color: var(--accent-ink); transform: rotate(2deg); }
.sticker.red { background: var(--red); color: var(--red-ink); }
.sticker.ink { background: var(--ink); color: var(--bg); }
.sticker.calm { background: var(--sage-soft); color: var(--ink); }
.sticker.float { position: absolute; top: -13px; right: 16px; transform: rotate(3deg); z-index: 2; }
.card { background: var(--surface); border: 2px solid var(--edge); border-radius: 22px; padding: 16px; box-shadow: var(--sh); }
.card.needs { border-color: var(--red); box-shadow: 6px 6px 0 var(--red); }
.stack { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }
.note { font-size: 12px; color: var(--muted); }
.hit { background: none; border: 0; padding: 0; text-align: left; width: 100%; color: inherit; font: inherit; }

/* icon squares */
.ico { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--edge); box-shadow: var(--sh-sm); display: grid; place-items: center; flex: none; }
.ico svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.y { background: var(--yellow); color: var(--yellow-ink); }
.ico.sm { width: 38px; height: 38px; border-radius: 12px; }
.ico.sm svg { width: 20px; height: 20px; }
.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--sh-sm); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--red); color: var(--red-ink); }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; padding: 6px 14px; font-size: 13px; box-shadow: 2px 2px 0 var(--shadow-c); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow-c); }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.link { background: none; border: 0; color: var(--link); font-weight: 700; padding: 4px 0; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 var(--text); padding: 6px 10px; border-radius: 999px; white-space: nowrap; background: var(--surface); color: var(--muted); border: 2px solid var(--edge); }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.pending { background: var(--surface); color: var(--muted); }
.badge.asked { background: var(--warn-soft); color: var(--warn); }
.badge.approved { background: var(--info-soft); color: var(--info); }
.badge.done { background: var(--ok-soft); color: var(--ok); }
.badge.coord { background: var(--yellow); color: var(--yellow-ink); }
.badge.plain::before { display: none; }

/* avatars (tappable, open the profile) */
.ava { width: var(--s, 36px); height: var(--s, 36px); border-radius: 50%; border: 2px solid var(--edge); display: grid; place-items: center; font: 800 calc(var(--s, 36px) * 0.34) var(--display); flex: none; color: var(--ink); }
.ava.c0 { background: var(--yellow); color: var(--yellow-ink); }
.ava.c1 { background: var(--accent-soft); }
.ava.c2 { background: var(--yellow-soft); }
.ava.c3 { background: var(--accent); color: var(--accent-ink); }
.ava.c4 { background: var(--surface); }
.ava.c5 { background: var(--ink); color: var(--bg); }
.ava-btn { background: none; border: 0; padding: 0; border-radius: 50%; display: inline-grid; flex: none; position: relative; }
.ava-btn::after { content: ""; position: absolute; inset: -4px; }
.chip-av { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 14px 4px 5px; border: 2px solid var(--edge); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 13px; box-shadow: 2px 2px 0 var(--shadow-c); }
.chip-av:active { transform: translate(2px, 2px); box-shadow: none; }
.name-btn { background: none; border: 0; padding: 0; font-weight: 700; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

/* home / track */
.hero-h { font: 800 32px/1.06 var(--display); letter-spacing: -0.03em; text-transform: uppercase; margin: 14px 0 20px; text-wrap: balance; }
.hl { background: linear-gradient(transparent 60%, var(--yellow) 60% 94%, transparent 94%); padding: 0 4px; margin-inline: -4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.goal-card { background: var(--yellow-soft); }
.ag { background: var(--accent-soft); }
.ag-h { font: 800 26px/1.1 var(--display); letter-spacing: -0.02em; margin: 10px 0 2px; }
.ag-pct { font: 800 20px var(--display); margin-top: 12px; }
.agb { display: grid; gap: 6px; }
.ag-strip { padding: 12px 14px; box-shadow: var(--sh-sm); }
.ag-strip .hit { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.ag-strip .grow { flex: 1; min-width: 0; display: grid; gap: 6px; }
.ag-strip .bar { height: 10px; }
.ag-p { font-weight: 700; }
.ag-note { background: var(--accent-soft); }
.ag-label { display: flex; align-items: center; gap: 10px; font-weight: 600; min-height: 44px; }
.ag-label input { width: 22px; height: 22px; accent-color: var(--accent); }
.err { color: var(--red-text); background: var(--red-soft); border: 2px solid var(--red); border-radius: 14px; padding: 10px 12px; font-weight: 600; margin: 0 0 10px; }
.goal { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pct { background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 12px; font-weight: 500; color: var(--ink); box-shadow: var(--sh-sm); }
.track { height: 20px; background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; margin-top: 14px; }
.track span { display: block; height: 100%; background: repeating-linear-gradient(45deg, var(--yellow) 0 8px, color-mix(in srgb, var(--yellow) 78%, var(--surface)) 8px 16px); border-right: 2px solid var(--edge); border-radius: 999px; transition: width 500ms ease-out; }
.today { background: var(--ink); color: var(--bg); display: grid; gap: 12px; position: relative; }
.today h2 { font: 800 24px/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.today .when-line { font: 500 13px var(--mono); opacity: 0.85; }
.today .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.today .btn { box-shadow: 3px 3px 0 var(--yellow); }
.today .btn:active { box-shadow: 0 0 0 var(--yellow); }
.tiles { display: grid; grid-template-columns: 1.1fr 1fr; grid-template-rows: auto auto; gap: 16px; }
.tile { padding: 14px; display: flex; gap: 10px; align-items: center; }
.tile .n { font: 800 28px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.tile:first-child { grid-row: span 2; background: var(--accent); color: var(--accent-ink); flex-direction: column; align-items: flex-start; justify-content: space-between; }
.tile:first-child .n { font-size: 64px; letter-spacing: -0.03em; }
.tile:first-child .l { font-size: 13px; font-weight: 600; color: var(--accent-ink); }
.tile:nth-child(3) { background: var(--yellow); color: var(--yellow-ink); }
.tile:nth-child(3) .l { color: var(--yellow-ink); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
.section-head h2 { font: 800 18px var(--display); margin: 0; }
.list-item { display: flex; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 2px dashed var(--line); }
.list-item:last-child { border-bottom: 0; }
.list-item .meta { flex: 1; min-width: 0; }
.list-item .meta b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.time { font: 500 13px var(--mono); color: var(--muted); flex: none; }

/* institutions (read-only list for now) */
.inst { display: grid; gap: 12px; }
.inst-top { display: flex; gap: 12px; align-items: center; }
.inst h3 { font: 800 17px/1.3 var(--display); margin: 0; min-width: 0; overflow-wrap: anywhere; }
.area { font-size: 12px; font-weight: 600; color: var(--muted); }
.dots { display: flex; gap: 4px; }
.dots i { width: 16px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--yellow); outline: 1px solid var(--edge); }

/* sessions */
.session { display: grid; gap: 12px; }
.session .top { display: flex; gap: 12px; align-items: center; }
.session h3 { margin: 0 0 4px; font: 800 16px/1.3 var(--display); overflow-wrap: anywhere; }
.strip { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.slot { display: grid; justify-items: center; gap: 3px; }
.slots { display: flex; gap: 6px; }
.cap { font: 600 10px/1 var(--text); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.spot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--muted); color: var(--muted); }
.spot svg { width: 16px; height: 16px; }
.spot.pend { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.divider { width: 2px; align-self: stretch; background: var(--line); border-radius: 2px; }

/* posts: calmer, roomier, serif titles */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.chip { min-height: 44px; padding: 6px 16px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); font-size: 13px; font-weight: 600; box-shadow: 2px 2px 0 var(--shadow-c); }
.chip[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }
.post { background: var(--surface); border: 2px solid var(--line); border-radius: 26px; padding: 22px 20px; position: relative; display: grid; gap: 12px; }
.post.pinned, .post.recap { background: var(--yellow-soft); border-color: var(--edge); box-shadow: var(--sh-sm); }
.post-meta { display: flex; align-items: center; gap: 10px; }
.post-title { font: 600 22px/1.25 var(--serif); margin: 0; text-wrap: balance; }
.post-body { font-size: 16px; line-height: 1.7; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.pill-stat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.pill-stat svg { width: 16px; height: 16px; }

/* v16 memories gallery */
.mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mem-grid button { padding: 0; border: 2px solid var(--edge); border-radius: 10px; overflow: hidden; background: var(--surface); aspect-ratio: 1; }
.mem-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* v16 goal ring + team thermometer */
.gring { display: flex; align-items: center; gap: 16px; }
.gring svg { flex: none; width: 92px; height: 92px; transform: rotate(-90deg); }
.gring .bg { fill: none; stroke: var(--surface); stroke-width: 11; }
.gring .fg { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; stroke-dasharray: var(--c); stroke-dashoffset: var(--o); }
.gring .mid { position: relative; width: 92px; height: 92px; flex: none; }
.gring .mid b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 20px var(--display); }
.thermo { height: 12px; margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) { .gring .fg.draw { animation: ringdraw 700ms ease-out; } }
@keyframes ringdraw { from { stroke-dashoffset: var(--c); } }
/* v16 kudos + reactions */
.react-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill-btn.rx { padding: 0 10px; min-width: 44px; }
.pill-btn[aria-pressed="true"].rx { background: var(--yellow-soft); }
.kcard { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 2px dashed var(--edge); }
.kcard:first-of-type { border-top: 0; }
.kcard .stk { font-size: 28px; line-height: 1; flex: none; }
/* v16 checklist ring + chat chips */
.ring { --p: 0; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--edge); background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg) 0); display: grid; place-items: center; flex: none; }
.ring span { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font: 800 10px var(--display); }
.qchips { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 8px; max-width: 430px; margin: 0 auto; }
.qchips .chip { white-space: nowrap; }
/* v16 pipeline board + stuck chip */
.stuck { display: inline-block; background: var(--yellow); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; padding: 2px 10px; font: 700 12px var(--display); }
.board { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin: 0 -4px; }
.bcol { flex: 0 0 78%; max-width: 300px; scroll-snap-align: start; border: 2px solid var(--edge); border-radius: 16px; padding: 10px; display: grid; gap: 8px; align-content: start; background: var(--bg); }
.bcol h3 { margin: 0; font: 800 15px var(--display); display: flex; justify-content: space-between; gap: 8px; }
.bcard { display: grid; gap: 4px; text-align: left; border: 2px solid var(--edge); border-radius: 12px; padding: 10px; background: var(--surface); width: 100%; }
.bcard b { overflow-wrap: anywhere; }
/* v16 quick wins: onboarding card */
.ob-step { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px dashed var(--edge); }
.ob-step:first-of-type { border-top: 0; }
.ob-step .tick { flex: none; width: 26px; height: 26px; border: 2px solid var(--edge); border-radius: 50%; display: grid; place-items: center; font: 800 13px var(--display); background: var(--bg); }
.ob-step.done .tick { background: var(--accent); }
.ob-step.done span.t { text-decoration: line-through; opacity: .6; }
.ob-step span.t { flex: 1; }
/* empty states + skeletons */
.empty { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 26px 20px 24px; }
.empty b { font: 800 18px var(--display); margin-top: 6px; }
.empty .illus { display: grid; place-items: center; min-height: 128px; margin-bottom: 4px; }
.empty .illus img { display: block; height: 128px; width: auto; max-width: 100%; object-fit: contain; }
.empty .illus.art-think img { height: 150px; }
.empty p { margin: 0; color: var(--muted); max-width: 32ch; }
.skel { display: grid; gap: 10px; }
.skel .b { height: 14px; border-radius: 8px; background: var(--line); }
.skel .b.w40 { width: 40%; } .skel .b.w60 { width: 60%; } .skel .b.w90 { width: 90%; }
.skel .b.tall { height: 28px; }

/* profile */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { text-align: center; padding: 12px 6px; border: 2px solid var(--edge); border-radius: 18px; background: var(--surface); }
.stat .n { font: 800 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; color: var(--muted); line-height: 1.25; }
.switch { width: 60px; height: 34px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); position: relative; padding: 0; box-shadow: var(--sh-sm); flex: none; }
.switch span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--edge); transition: transform 160ms; }
.switch[aria-checked="true"] { background: var(--yellow); }
.switch[aria-checked="true"] span { transform: translateX(26px); background: var(--yellow-ink); }

/* notifications */
.notif { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); position: relative; }
.notif.unread { background: var(--yellow-soft); border-color: var(--edge); }
.notif p { margin: 0; overflow-wrap: anywhere; }
.udot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--edge); position: absolute; top: 12px; right: 12px; }

/* nav */
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 2px solid var(--edge); z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .inner { max-width: 430px; margin: 0 auto; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); }
.tab { background: none; border: 0; padding: 8px 0 7px; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); min-height: 58px; }
.tab svg { width: 48px; height: 30px; padding: 4px 13px; border-radius: 999px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 800; }
.tab[aria-current="page"] svg { background: var(--yellow); color: var(--yellow-ink); box-shadow: 0 0 0 2px var(--edge); }

/* sheet (confirmation + generic) */
.sheet { position: fixed; inset: 0; background: rgba(52, 45, 69, 0.5); display: grid; align-items: end; z-index: 55; }
.sheet .panel { background: var(--surface); border: 2px solid var(--edge); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 430px; width: 100%; margin: 0 auto; display: grid; gap: 12px; max-height: 88vh; overflow: auto; }
.sheet .panel h3 { margin: 0; font: 800 20px var(--display); }
.sheet .panel p { margin: 0; }
.sheet-actions { display: grid; gap: 10px; }

.toast { display: flex; align-items: center; justify-content: center; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 13px; z-index: 70; max-width: calc(100% - 32px); text-align: center; border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--accent); }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; left: 50%; top: 60%; width: 10px; height: 14px; border: 2px solid var(--edge); border-radius: 3px; animation: pop 1100ms cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes pop { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding: 2px 4px 8px; margin-inline: -4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.badge.red { background: var(--red-soft); color: var(--red-text); border-color: var(--red); }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }
.acts .btn { flex: 1 1 auto; }
.nv { padding: 0; overflow: hidden; border-color: var(--red); }
.nv-head { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--red); color: var(--red-ink); border: 0; padding: 14px 16px; text-align: left; font: 800 16px var(--display); min-height: 52px; }
.nv-head svg { stroke: currentColor; }
.nv-head .chev { transition: transform 160ms; }
.nv-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.nv-body { padding: 4px 16px 12px; }
.nv-row { display: grid; gap: 8px; padding: 12px 0; border-bottom: 2px dashed var(--line); }
.nv-row:last-child { border-bottom: 0; }
.sub-h { font: 700 11px/1.2 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }
.team-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 2px dashed var(--line); }
.team-row:last-child { border-bottom: 0; }
.hero-card { display: grid; gap: 12px; background: var(--yellow-soft); }
.hero-card h2 { font: 800 22px/1.2 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cdot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--edge); display: inline-block; }
.toast .t-act { background: var(--yellow); color: var(--yellow-ink); border: 0; border-radius: 999px; font-weight: 800; margin-left: 10px; padding: 6px 14px; min-height: 36px; }


/* step 3: forms, allotment, notification actions */
.field { display: grid; gap: 6px; }
.lbl { font: 600 12px/1.2 var(--text); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.inp { width: 100%; min-height: 46px; padding: 10px 14px; border: 2px solid var(--edge); border-radius: 16px; background: var(--surface); }
textarea.inp { min-height: 90px; resize: vertical; }
.err { color: var(--red-text); font-weight: 700; margin: 0; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper b { font: 800 22px var(--display); min-width: 28px; text-align: center; }
.stepper .btn { padding: 0; width: 46px; }
.pendcard { background: var(--yellow-soft); display: grid; gap: 10px; }
.t-acts, .n-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.n-acts { margin-top: 8px; }
.n-out { font-size: 12px; font-weight: 700; margin-top: 6px; color: var(--muted); }
.team-row { flex-wrap: wrap; }
.pick { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 2px dashed var(--line); flex-wrap: wrap; }
.pick:last-child { border-bottom: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bad { color: var(--red-text); font-weight: 600; }


/* step 4: goals, institutions */
.gt { padding: 12px; display: grid; gap: 8px; box-shadow: var(--sh-sm); }
.gt .n { font: 800 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.gt .of { font-size: 14px; color: var(--muted); font-weight: 600; }
.gt .l { font-size: 12px; color: var(--muted); line-height: 1.3; }
.gt.wide { grid-column: span 2; background: var(--accent); color: var(--accent-ink); }
.gt.wide .of, .gt.wide .l { color: var(--accent-ink); }
.gtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mrow b { font: 800 16px var(--display); text-align: center; }
.tick { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--edge); background: var(--surface); display: grid; place-items: center; flex: none; padding: 0; }
.tick[aria-pressed="true"], .tick.on { background: var(--yellow); color: var(--yellow-ink); }
.tick svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tl { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--line); }
.tl:last-child { border-bottom: 0; }
.mini { box-shadow: none; padding: 12px; display: grid; gap: 8px; }


/* step 5: swipe, chat, gallery */
.swipe { position: relative; height: 48px; border: 2px solid var(--edge); border-radius: 999px; background: var(--yellow-soft); overflow: hidden; touch-action: pan-y; user-select: none; }
.swipe .lbl2 { position: absolute; inset: 0; display: grid; place-items: center; padding-left: 44px; font: 700 12px var(--text); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.swipe .knob { position: absolute; top: 2px; left: 2px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--edge); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; padding: 0; font: 800 22px var(--display); touch-action: none; }
.msg { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
.msg.mine { flex-direction: row-reverse; }
.bub { max-width: 78%; background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 8px 12px; }
.msg.mine .bub { background: var(--yellow-soft); }
.bub .who { font: 700 11px var(--text); color: var(--muted); }
.bub p { margin: 2px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.bub time { font: 500 11px var(--mono); color: var(--muted); }
.sysmsg { text-align: center; font-size: 12px; color: var(--muted); margin: 8px 0; }
.composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--edge); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.composer .in { max-width: 430px; margin: 0 auto; display: flex; gap: 8px; }
.rc-hero { display: grid; gap: 10px; }
.rc-title { font: 600 26px/1.2 var(--serif); margin: 4px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
.rc-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.rc-meta span + span::before { content: "·"; margin-right: 14px; }
.rc-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.rc-stats span { background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--ink); }
.rc-stats b { font-family: var(--display); font-weight: 800; font-size: 14px; margin-right: 3px; }
.rc-wait { display: grid; gap: 4px; background: var(--surface); border: 2px dashed var(--edge); border-radius: 16px; padding: 12px 14px; }
.rc-cover { display: grid; gap: 6px; border: 2px solid var(--edge); border-radius: 20px; overflow: hidden; box-shadow: var(--sh-sm); background: var(--edge); }
.rc-cell { position: relative; padding: 0; border: 0; background: var(--line); display: block; min-height: 0; overflow: hidden; }
.rc-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rc-cover.c1 { grid-template-columns: 1fr; } .rc-cover.c1 .rc-cell { aspect-ratio: 4 / 3; }
.rc-cover.c2 { grid-template-columns: 1fr 1fr; } .rc-cover.c2 .rc-cell { aspect-ratio: 3 / 4; }
.rc-cover.c3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 1 / 1; } .rc-cover.c3 .rc-cell:first-child { grid-row: span 2; }
.rc-cover.c4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 1 / 1; }
.rc-more { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(52,45,69,.62); color: #FAF4ED; font: 800 26px var(--display); }
.rc-team { display: grid; gap: 8px; }
.rc-sec { display: grid; gap: 10px; }
.rc-quote { margin: 0; background: var(--surface); border: 2px solid var(--edge); border-radius: 20px; padding: 16px 16px 14px; display: grid; gap: 12px; position: relative; box-shadow: var(--sh-sm); }
.rc-quote::before { content: "\201C"; position: absolute; top: -2px; left: 12px; font: 700 54px/1 var(--serif); color: var(--peach); }
.rc-quote blockquote { margin: 14px 0 0; font: 500 16px/1.65 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.rc-quote figcaption { display: flex; align-items: center; gap: 10px; }
.rc-quote figcaption > span { display: grid; min-width: 0; }
.rc-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.rc-thumb { flex: none; width: 96px; height: 96px; padding: 0; border: 2px solid var(--edge); border-radius: 14px; overflow: hidden; background: var(--line); }
.rc-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gallery figure { margin: 0; display: grid; gap: 4px; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border: 2px solid var(--edge); border-radius: 14px; background: var(--line); }
.gallery figcaption { font-size: 12px; color: var(--muted); }


/* step 6: feed */
.pill-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 14px; border: 2px solid var(--edge); border-radius: 999px; background: var(--surface); font: 600 13px var(--text); }
.pill-btn svg { width: 16px; height: 16px; }
.pill-btn[aria-pressed="true"] svg { fill: var(--accent); stroke: var(--accent); }
.pill-btn[aria-pressed="true"], .pill-btn[aria-expanded="true"] { background: var(--yellow-soft); }
.cm { display: grid; gap: 6px; padding: 12px 0; border-top: 2px dashed var(--line); }
.cm p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.cm.reply { margin-left: 22px; padding-left: 12px; border-left: 3px solid var(--line); border-top: 0; }
.cm-head { display: flex; align-items: center; gap: 8px; }
.cm-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.cm-acts .pill-btn { min-height: 44px; }
.photo-btn { background: none; border: 0; padding: 0; display: block; width: 100%; }
.viewer { position: fixed; inset: 0; background: rgba(20, 14, 10, 0.95); z-index: 80; display: grid; grid-template-rows: auto 1fr auto; color: #fff; }
.viewer .vtop, .viewer .vbot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; }
.viewer .vimg { display: grid; place-items: center; min-height: 0; padding: 0 8px; touch-action: pan-y; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
.viewer .btn { box-shadow: none; }


/* step 7: profile pages, control tab, deep-link flash */
.note .link { text-align: left; }
.name-btn { position: relative; }
.name-btn::after { content: ""; position: absolute; inset: -12px -4px; }
.flash { outline: 3px solid var(--yellow); outline-offset: 3px; }
.act-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 2px dashed var(--line); }
.act-item:last-child { border-bottom: 0; }
.act-item p { margin: 0; overflow-wrap: anywhere; }
.vrow { display: grid; gap: 8px; padding: 14px 0; border-bottom: 2px dashed var(--line); }
.vrow:last-child { border-bottom: 0; }
.vrow p { margin: 0; overflow-wrap: anywhere; }
.bar { height: 12px; border: 2px solid var(--edge); border-radius: 999px; background: var(--surface); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--yellow); border-right: 2px solid var(--edge); }
.bar span[style*="width:0%"] { border-right: 0; }
.break { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.break .badge { font-weight: 600; }

/* step 8: polish, accessibility, small screens, long text */
html { -webkit-text-size-adjust: 100%; }
html { overflow-x: clip; max-width: 100%; }
body { overflow-x: clip; max-width: 100%; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; }
button, a, [role="switch"] { touch-action: manipulation; }
b, h1, h2, h3, dd, dt, label, .hit, .name-btn, .chip-av, .sheet .panel, .toast { overflow-wrap: anywhere; }
.hit { min-width: 0; }
.link, .btn, .chip, .pill-btn { overflow-wrap: anywhere; max-width: 100%; }
.link { text-align: left; }
/* grid tracks must be allowed to shrink so long names wrap instead of widening the page */
.stack, .session, .inst, .inst .hit, .vrow, .post, .skel, .today, .hero-card, .pendcard, .mini, .cm, .gt, .nv-row, .field, .sheet-actions, .sheet .panel, .empty, .slot { grid-template-columns: minmax(0, 1fr); }
.tiles, .gtiles, .contact, .two, .stats, .today .btns, .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiles { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kv { grid-template-columns: auto minmax(0, 1fr); }
.notif { grid-template-columns: 44px minmax(0, 1fr); }
.gt.wide { grid-column: span 2; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[tabindex="-1"]:focus { outline: none; }
.inp { font-size: 16px; min-width: 0; }
.inp::placeholder { color: var(--muted); opacity: 1; }
.two > *, .field { min-width: 0; }
a.link { display: inline-flex; align-items: center; }
.cap { font-size: 11px; }
.btn { text-align: center; line-height: 1.25; }
.badge.wrapb { white-space: normal; line-height: 1.25; }
.ava-btn::after { inset: min(0px, calc((44px - 100%) / -2)); }
.switch::after { content: ""; position: absolute; inset: -6px -2px; }
.swipe .knob { top: 0; left: 0; width: 44px; height: 44px; }
.knob:focus-visible, .nv-head:focus-visible { outline-color: var(--accent-ink); outline-offset: -5px; }
.chips.scroll { padding: 6px 6px 12px; margin-inline: -6px; }
.post { scroll-margin-top: 84px; }
.today .row { flex-wrap: wrap; }
.toast .t-act { min-height: 44px; }
.sheet { overscroll-behavior: contain; }
.vwho { flex: 1; min-width: 0; text-align: center; font-size: 13px; }
.viewer .vbot .btn { flex: none; }
.viewer .link { min-height: 44px; }
@media (max-width: 380px) {
  .btn { padding-inline: 14px; gap: 6px; }
  .contact .btn, .two .btn, .today .btn { padding-inline: 8px; font-size: 13px; }
  .post { padding: 18px 14px; }
  .topbar h1 { font-size: 24px; }
  .hero-h { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}

@media (prefers-reduced-motion: no-preference) {
  .screen.anim { animation: rise 220ms ease-out; }
  @keyframes rise { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .btn, .chip, .icon-btn { transition: transform 80ms ease-out, box-shadow 80ms ease-out; }
  .skel .b { position: relative; overflow: hidden; }
  .skel .b::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 75%, transparent), transparent); transform: translateX(-100%); animation: shimmer 1.3s ease-in-out infinite; }

}
/* v19 polish: badge unlock card */
.unlock { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 6px 0 2px; }
.unlock .ub { display: grid; gap: 4px; justify-items: center; }

/* v18 polish: motion only when allowed, transform and opacity only, 150-400 ms */

.greet h2 { font: 800 21px/1.2 var(--display); letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) {

  @keyframes cardin { from { opacity: 0; transform: translateY(8px); } }

  .tab.bounce svg { animation: tabbounce 300ms ease-out; }
  @keyframes tabbounce { 40% { transform: translateY(-4px) scale(1.1); } }
  .wiggle { animation: wiggle 600ms ease-in-out 1; }
  @keyframes wiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(4deg); } }

}

<script>
'use strict';
/* =========================================================
   Miracle Volunteers, Steps 1-7: foundation, sessions, allotment, Track tab, completion and chat, posts feed and recaps, profile pages and Control tab.
   1 utils · 2 seed data · 3 store + derived · 4 data layer (API)
   5 UI helpers · 6 screens · 7 events · 8 boot
   Everything reads the current user from store.currentUserId.
   Data changes happen only inside API.* functions, so each can later be swapped for a Firebase call.
   ========================================================= */

/* ---------- 1. utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000, HOUR = 3600000;
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dateKey(new Date());
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return dateKey(d); };
const daysUntil = k => Math.round((parseDate(k) - parseDate(todayKey())) / DAY);
const fmtDay = k => { const d = parseDate(k); return `${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtShort = k => { const d = parseDate(k); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDM = ms => { const d = new Date(ms); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const msOf = (k, t) => { const [y, m, d] = k.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, d, h, mi).getTime(); };
const monthKeyOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return `${MONTHS_LONG[m - 1]} ${y}`; };
const initials = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
const mapsHref = i => (i.mapLink && /^https?:\/\//i.test(i.mapLink)) ? i.mapLink : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(`${i.name}, ${i.address}`);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function whenTxt(k) {
  const n = daysUntil(k);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n > 1) return `In ${n} days`;
  if (n === -1) return 'Yesterday';
  return `${-n} days ago`;
}
function agoTxt(ms) {
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const d = Math.floor(h / 24);
  if (d === 1) return 'Yesterday';
  if (d < 7) return d + ' days ago';
  return fmtDM(ms);
}

/* ---------- 2. seed data ---------- */
const AREA_OPTS = ['Kharghar', 'Panvel', 'Other'];
const STAGES = [
  { key: 'yet', label: 'Yet to visit', cls: 'pending' },
  { key: 'visited', label: 'Visited', cls: 'asked', field: 'visitedAt' },
  { key: 'permission', label: 'Permission granted', cls: 'asked', field: 'permissionAt' },
  { key: 'form', label: 'Request form received', cls: 'approved', field: 'formReceivedAt' },
  { key: 'approved', label: 'Form approved', cls: 'approved', field: 'formApprovedAt' },
  { key: 'conducted', label: 'Session conducted', cls: 'done' },
  { key: 'repeat', label: 'Repeat', cls: 'done' }
];
const DEFAULT_GOALS = { sessions: 10, visits: 8, permissions: 6, formsReceived: 4, formsApproved: 3 };

function seedStore() {
  const cm = monthKeyOf(Date.now());
  return { currentUserId: null, users: [], institutions: [], sessions: [], posts: [], comments: [], notifications: [], kudos: [], goals: { [cm]: { ...DEFAULT_GOALS } }, agendas: [], agendaSeq: 0, chatRead: {}, queue: [] };
}

/* ---------- 3. store + derived ---------- */
let store = seedStore();
const me = () => store.users.find(u => u.id === store.currentUserId);
const userById = id => store.users.find(u => u.id === id) || null;
const instById = id => store.institutions.find(i => i.id === id) || null;
const sessById = id => store.sessions.find(s => s.id === id) || null;
const postById = id => store.posts.find(p => p.id === id) || null;
const isCoord = u => !!u && u.role === 'coordinator';
const firstName = u => (u ? u.name.split(' ')[0] : 'Someone');

const spotsOf = s => [{ key: 'c', role: 'conducting', spot: s.spots.conducting }, ...s.spots.supporting.map((sp, i) => ({ key: 's' + i, role: 'supporting', spot: sp }))];
const userSpot = (s, id) => spotsOf(s).find(x => x.spot.userId === id && x.spot.state !== 'open') || null;
const RECAP_PHOTOS = 4, RECAP_WAIT = 48 * 3600 * 1000;
const recapDone = p => new Set([...p.photos.map(x => x.byUserId), ...Object.keys(p.experiences)]);
const recapWaiting = (s, p) => { const d = recapDone(p); return API.participants(s).filter(x => isMember(s, x) && !d.has(x)); };
const recapDeadline = s => (s.completedAt || 0) + RECAP_WAIT;
const recapReady = (s, p) => recapDone(p).size > 0 && (recapWaiting(s, p).length === 0 || Date.now() >= recapDeadline(s));
const postVisible = p => {
  if (p.type !== 'recap') return true;
  const s = sessById(p.sessionId); if (!s) return false;
  return recapReady(s, p) || isMember(s, me().id) || isCoord(me());
};
const isMember = (s, id) => spotsOf(s).some(x => x.spot.userId === id && x.spot.state === 'filled');

function readiness(s) {
  if (s.status !== 'upcoming') return 'done';
  if (s.spots.conducting.state !== 'filled') return 'needs-conductor';
  const sup = s.spots.supporting, f = sup.filter(x => x.state === 'filled').length;
  if (f === 0) return 'needs-supporter';
  return f === sup.length ? 'full' : 'ready';
}
const isRed = s => { const r = readiness(s); return r === 'needs-conductor' || r === 'needs-supporter'; };
const isUrgent = s => s.status === 'upcoming' && daysUntil(s.date) <= 3 && isRed(s);
const unfilledSupport = s => s.spots.supporting.filter(x => x.state !== 'filled').length;
const bySchedule = (a, b) => msOf(a.date, a.startTime) - msOf(b.date, b.startTime);

function completedCount(instId) { return store.sessions.filter(s => s.institutionId === instId && s.status === 'completed').length; }
function stageIdx(i) {
  const c = completedCount(i.id);
  if (c >= 2) return 6;
  if (c === 1) return 5;
  let idx = 0;
  STAGES.forEach((s, k) => { if (s.field && i.manualStages[s.field]) idx = k; });
  return idx;
}
function instTag(i) {
  if (i.declined) return { key: 'declined', label: 'Declined', cls: 'pending', idx: -1 };
  const idx = stageIdx(i), s = STAGES[idx];
  return { key: s.key, label: s.label, cls: s.cls, idx };
}
function userStats(id) {
  const done = store.sessions.filter(s => s.status === 'completed');
  const conducted = done.filter(s => s.spots.conducting.userId === id && s.spots.conducting.state === 'filled').length;
  const supported = done.filter(s => s.spots.supporting.some(x => x.userId === id && x.state === 'filled')).length;
  const posts = store.posts.filter(p => p.authorId === id).length;
  const comments = store.comments.filter(c => c.authorId === id).length;
  const photos = store.posts.reduce((n, p) => n + p.photos.filter(ph => ph.byUserId === id).length, 0);
  return { conducted, supported, posts, comments, photos, contributions: conducted + supported + posts + comments + photos };
}
const unreadCount = id => store.notifications.filter(n => n.toUserId === id && !n.read).length;
function teamGoal(mk) {
  const keys = Object.keys(store.goals).sort().filter(k => k <= mk);
  return { ...DEFAULT_GOALS, ...(keys.length ? store.goals[keys[keys.length - 1]] : {}) };
}
function goalProgress(mk) {
  const inM = ms => ms && monthKeyOf(ms) === mk, cnt = f => store.institutions.filter(i => inM(i.manualStages[f])).length;
  return {
    sessions: store.sessions.filter(s => s.status === 'completed' && inM(s.completedAt)).length,
    visits: cnt('visitedAt'), permissions: cnt('permissionAt'), formsReceived: cnt('formReceivedAt'), formsApproved: cnt('formApprovedAt')
  };
}
function myProgress(id, mk) {
  const d = store.sessions.filter(s => s.status === 'completed' && s.completedAt && monthKeyOf(s.completedAt) === mk);
  return {
    conducted: d.filter(s => s.spots.conducting.userId === id && s.spots.conducting.state === 'filled').length,
    supported: d.filter(s => s.spots.supporting.some(x => x.userId === id && x.state === 'filled')).length
  };
}
const agById = id => store.agendas.find(a => a.id === id) || null;
const agendaName = a => `Agenda ${a.n}` + (a.title ? ` · ${a.title}` : '');
const agendaStatus = a => { const t = todayKey(); return t < a.start ? 'upcoming' : t > a.end ? 'ended' : 'active'; };
const inAgenda = (ms, a) => { if (!ms) return false; const k = dateKey(new Date(ms)); return k >= a.start && k <= a.end; };
const agendaFor = k => store.agendas.find(a => k >= a.start && k <= a.end) || null;
const currentAgenda = () => store.agendas.find(a => agendaStatus(a) === 'active') || null;
const nextAgenda = () => store.agendas.filter(a => agendaStatus(a) === 'upcoming').sort((a, b) => a.start.localeCompare(b.start))[0] || null;
function agendaProgress(a) {
  const doneList = store.sessions.filter(s => s.status === 'completed' && inAgenda(s.completedAt, a)).sort((x, y) => y.completedAt - x.completedAt);
  const upList = store.sessions.filter(s => s.status === 'upcoming' && s.date >= a.start && s.date <= a.end).sort(bySchedule);
  const ids = new Set();
  store.institutions.forEach(i => { if (inAgenda(i.manualStages.visitedAt, a)) ids.add(i.id); });
  doneList.forEach(s => ids.add(s.institutionId));
  const instList = store.institutions.filter(i => ids.has(i.id));
  const parts = [[doneList.length, a.goals.sessions], [instList.length, a.goals.institutions]].filter(x => x[1] > 0);
  return { sessions: doneList.length, institutions: instList.length, scheduled: upList.length, doneList, upList, instList,
    pct: parts.length ? Math.round(parts.reduce((n, [d, t]) => n + Math.min(1, d / t), 0) / parts.length * 100) : 0,
    met: parts.length > 0 && parts.every(([d, t]) => d >= t) };
}
const shiftMonth = (mk, d) => { const [y, m] = mk.split('-').map(Number), t = new Date(y, m - 1 + d, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; };

/* ---------- 4. data layer (swap each function for a Firebase call later) ---------- */
const API = {
  resetDemo() {
    const keepUser = store.currentUserId;
    store = seedStore();
    store.currentUserId = keepUser;
    API.syncReminders();
    return { ok: true };
  },
  notify(toUserId, type, payload = {}) {
    if (!userById(toUserId)) return;
    store.notifications.push({ id: uid('n'), toUserId, type, payload, read: false, createdAt: Date.now(), actionState: null });
  },
  markRead(id) {
    const n = store.notifications.find(x => x.id === id);
    if (n && n.toUserId === store.currentUserId) n.read = true;
  },
  markAllRead(userId) {
    store.notifications.forEach(n => { if (n.toUserId === userId) n.read = true; });
  },
  sysMsg(s, text) { s.messages.push({ id: uid('m'), userId: 'system', text, at: Date.now() }); },
  notifyCoordinators(type, payload, exceptId) {
    store.users.filter(u => isCoord(u) && u.id !== exceptId).forEach(u => API.notify(u.id, type, payload));
  },
  joinSession(sid, role, userId) {
    const s = sessById(sid), u = userById(userId);
    if (!s || !u) return { ok: false, error: 'That session is no longer available.' };
    if (s.status !== 'upcoming') return { ok: false, error: 'This session is no longer open.' };
    if (userSpot(s, userId)) return { ok: false, error: 'You already have a spot in this session.' };
    let spot;
    if (role === 'conducting') {
      spot = s.spots.conducting;
      if (spot.state !== 'open') return { ok: false, error: 'The conducting spot was just taken.' };
    } else {
      spot = s.spots.supporting.find(x => x.state === 'open');
      if (!spot) return { ok: false, error: 'No supporting spots are open.' };
    }
    spot.userId = userId; spot.state = 'filled'; delete spot.askedBy; delete spot.askedAt; spot.joinedAt = Date.now();
    API.sysMsg(s, `${u.name} joined as ${cap(role)}`);
    return { ok: true };
  },
  leaveSession(sid, userId) {
    const s = sessById(sid), u = userById(userId);
    if (!s || !u) return { ok: false, error: 'That session is no longer available.' };
    if (s.status !== 'upcoming') return { ok: false, error: 'Completed or cancelled sessions cannot be left.' };
    const e = spotsOf(s).find(x => x.spot.userId === userId && x.spot.state === 'filled');
    if (!e) return { ok: false, error: 'You are not in this session.' };
    e.spot.userId = null; e.spot.state = 'open'; delete e.spot.askedBy; delete e.spot.askedAt;
    API.sysMsg(s, `${firstName(u)} left the session`);
    API.notifyCoordinators('spot_vacated', { sessionId: sid, role: e.role, fromUserId: userId }, userId);
    return { ok: true };
  },

  /* ---- step 3: allotment and session management (coordinator actions) ---- */
  _coord(id) { return isCoord(userById(id)); },
  participants(s, exceptId) { return [...new Set(spotsOf(s).filter(x => x.spot.state !== 'open' && x.spot.userId).map(x => x.spot.userId))].filter(x => x !== exceptId); },
  _expire(sid, state) {
    store.notifications.forEach(n => { if (n.type === 'allot_request' && n.payload.sessionId === sid && !n.actionState) n.actionState = state; });
  },
  _ask(s, key, userId, byId) {
    const e = spotsOf(s).find(x => x.key === key);
    if (!e) return { ok: false, error: 'That spot does not exist.' };
    if (e.spot.state !== 'open') return { ok: false, error: 'That spot is no longer open.' };
    if (!userById(userId)) return { ok: false, error: 'Unknown volunteer.' };
    if (userSpot(s, userId)) return { ok: false, error: `${firstName(userById(userId))} already has a spot in this session.` };
    Object.assign(e.spot, { userId, state: 'pending', askedBy: byId, askedAt: Date.now() });
    API.notify(userId, 'allot_request', { sessionId: s.id, spotKey: key, role: e.role, fromUserId: byId });
    return { ok: true };
  },
  askToJoin(sid, key, userId, byId) {
    const s = sessById(sid);
    if (!API._coord(byId)) return { ok: false, error: 'Only coordinators can allot volunteers.' };
    if (!s || s.status !== 'upcoming') return { ok: false, error: 'This session is no longer open.' };
    return API._ask(s, key, userId, byId);
  },
  respondAllot(nid, accept, userId) {
    const n = store.notifications.find(x => x.id === nid && x.toUserId === userId && x.type === 'allot_request');
    if (!n || n.actionState) return { ok: false, error: 'This request was already answered.' };
    const s = sessById(n.payload.sessionId), e = s && spotsOf(s).find(x => x.key === n.payload.spotKey);
    n.read = true;
    if (!s || s.status !== 'upcoming' || !e || e.spot.state !== 'pending' || e.spot.userId !== userId) { n.actionState = 'expired'; return { ok: false, error: 'This request is no longer active.' }; }
    const u = userById(userId);
    n.actionState = accept ? 'accepted' : 'declined';
    delete e.spot.askedBy; delete e.spot.askedAt;
    if (accept) { e.spot.state = 'filled'; e.spot.joinedAt = Date.now(); API.sysMsg(s, `${u.name} joined as ${cap(e.role)}`); }
    else { e.spot.userId = null; e.spot.state = 'open'; }
    API.notify(n.payload.fromUserId, accept ? 'allot_accepted' : 'allot_declined', { sessionId: s.id, role: e.role, fromUserId: userId });
    return { ok: true };
  },
  cancelRequest(sid, key, byId) {
    const s = sessById(sid), e = s && spotsOf(s).find(x => x.key === key);
    if (!API._coord(byId)) return { ok: false, error: 'Only coordinators can cancel requests.' };
    if (!e || e.spot.state !== 'pending') return { ok: false, error: 'There is no pending request on that spot.' };
    store.notifications.forEach(n => { if (n.type === 'allot_request' && n.payload.sessionId === sid && n.payload.spotKey === key && n.toUserId === e.spot.userId && !n.actionState) n.actionState = 'cancelled'; });
    Object.assign(e.spot, { userId: null, state: 'open' }); delete e.spot.askedBy; delete e.spot.askedAt;
    return { ok: true };
  },
  removeVolunteer(sid, key, byId) {

  updateSession(id, d, byId) {

function toast(msg, ms = 2200, action = null) {
  const t = $('#toast'), live = $('#live');
  if (live) { live.textContent = ''; clearTimeout(toast.lt); toast.lt = setTimeout(() => { live.textContent = msg; }, 50); }
  t.innerHTML = `<span aria-hidden="true">${esc(msg)}</span>${action ? `<button class="t-act" data-act="toastAction">${esc(action.label)}</button>` : ''}`;
  toast.fn = action ? action.fn : null;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, ms);
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const cols = ['var(--accent)', 'var(--yellow)', 'var(--ink)', 'var(--yellow-soft)'];
  for (let i = 0; i < 32; i++) {
    const p = document.createElement('i');
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 180;
    p.style.setProperty('--x', Math.cos(a) * d + 'px');
    p.style.setProperty('--y', (Math.sin(a) * d - 120) + 'px');
    p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = (Math.random() * 80) + 'ms';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1400);
}
/* v18 polish helpers: all are no-ops when the person prefers reduced motion */
const calmMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function buzz(ms = 10) { try { if (!calmMotion() && navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ } }
function sparks(el) {
  if (!el || calmMotion()) return;
  const r = el.getBoundingClientRect(), box = document.createElement('div');
  box.className = 'sparks'; box.style.left = (r.left + r.width / 2) + 'px'; box.style.top = (r.top + r.height / 2) + 'px';
  for (let i = 0; i < 5; i++) {
    const p = document.createElement('i'), a = (i / 5) * Math.PI * 2 + Math.random() * 0.6;
    p.style.setProperty('--x', Math.cos(a) * 28 + 'px'); p.style.setProperty('--y', Math.sin(a) * 28 + 'px'); p.style.setProperty('--r', '0deg');
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 700);
}

function burstOn(sel, onlyIfPressed) {
  afterRender(() => { const b = document.querySelector('#view ' + sel); if (!b || (onlyIfPressed && b.getAttribute('aria-pressed') !== 'true')) return; b.classList.add('rxpop'); sparks(b); buzz(10); });

/* numbers marked data-count rise from 0 once per screen and value (final value is already in the HTML) */
function countUps(scope) {
  const els = document.querySelectorAll('#view [data-count]'); if (!els.length || calmMotion()) return;
  ui.countSeen = ui.countSeen || new Set();
  els.forEach((el, i) => {
    const to = Number(el.dataset.count), key = scope + ':' + i + ':' + to;
    if (!isFinite(to) || to <= 0 || ui.countSeen.has(key)) return;
    ui.countSeen.add(key);
    const fmt = el.dataset.fmt === 'in' ? fmtN : String, t0 = performance.now();
    (function step(t) {
      if (!el.isConnected) return;
      const p = Math.min(1, Math.max(0, (t - t0) / 600));
      el.textContent = fmt(p < 1 ? Math.round(to * (1 - Math.pow(1 - p, 3))) : to);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}

/* v16 streaks, levels, badges: all computed from sessions, posts and institutions; nothing is stored */
const LEVELS = [['Seedling', 0], ['Sprout', 3], ['Bloom', 8], ['Tree', 15], ['Grove', 30]];
const prevMonthKey = mk => { const [y, m] = mk.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`; };
function userProgress(id) {
  const mine = store.sessions.filter(s => s.status === 'completed' && spotsOf(s).some(e => e.spot.state === 'filled' && e.spot.userId === id));
  const st = userStats(id), months = new Set(mine.map(s => monthKeyOf(s.completedAt)));
  const nowK = monthKeyOf(Date.now());
  let cur = months.has(nowK) ? nowK : prevMonthKey(nowK), streak = 0;      // this month is still open, so a streak is only broken once a month ends empty
  while (months.has(cur)) { streak++; cur = prevMonthKey(cur); }
  let longest = 0, run = 0;
  [...months].sort().forEach((k, n, a) => { run = n && prevMonthKey(k) === a[n - 1] ? run + 1 : 1; longest = Math.max(longest, run); });
  const opened = store.institutions.filter(i => i.createdBy === id && completedCount(i.id) >= 1).length, repeats = store.institutions.filter(i => i.createdBy === id && completedCount(i.id) >= 2).length;

  store.sessions.forEach(s => spotsOf(s).forEach(e => {
    if (e.spot.state !== 'filled' || e.spot.userId !== id || !e.spot.joinedAt) return;
    if (s.createdAt && e.spot.joinedAt - s.createdAt <= 3600000) early++;
    const startMs = new Date(`${s.date}T${s.startTime || '09:00'}:00`).getTime();

}

function agFormInit(a) {
  if (a) return { id: a.id, title: a.title, start: a.start, end: a.end, sessions: String(a.goals.sessions), institutions: String(a.goals.institutions), announce: false };
  const last = [...store.agendas].sort((x, y) => y.end.localeCompare(x.end))[0];
  let start = todayKey(); if (last && last.end >= start) { const d = parseDate(last.end); d.setDate(d.getDate() + 1); start = dateKey(d); }
  const e = parseDate(start); e.setDate(e.getDate() + 13);
  return { id: null, title: '', start, end: dateKey(e), sessions: last ? String(last.goals.sessions) : '10', institutions: last ? String(last.goals.institutions) : '5', announce: true };
}

    pins[Math.min(i, 5)].focus();
  }
  pins.forEach((p, i) => {

<!-- ===== Firestore data sync: keeps the whole app store in the cloud ===== -->
<script>
(function () {
  const auth = firebase.auth(), db = firebase.firestore();
  const LISTS = ['users', 'institutions', 'sessions', 'posts', 'comments', 'notifications', 'agendas', 'kudos'];
  const MAPS = ['goals', 'chatRead'];
  const ALL = LISTS.concat(MAPS, ['images', 'meta']);
  let ready = false, started = false, flushing = false, timer = null, unsubs = [], seen = new Set(), lastSeq = null;
  let plain = {}, raw = {}, imgs = new Map(), urlId = new Map(), failed = new Set();
  const isList = c => LISTS.indexOf(c) >= 0;
  setTimeout(() => chip('loaded'), 0);

  // ---- visible sync status: a red strip stays on screen while changes are NOT reaching the database ----
  const VER = 'v13';
  const blocked = new Set();
  function chip(t) {
    let el = document.getElementById('sync-chip');
    if (!el) {
      el = document.createElement('div'); el.id = 'sync-chip';
      el.style.cssText = 'position:fixed;left:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:10001;background:rgba(52,45,69,.88);color:#fff;font:11px/1.2 var(--mono);padding:3px 8px;border-radius:8px;pointer-events:none;max-width:70vw';
      if (!/[?&]debug\b/.test(location.search)) el.style.display = 'none'; // hidden unless the address ends with ?debug
      document.body.appendChild(el);
    }
    el.textContent = VER + ' \u00b7 ' + t + (blocked.size ? ' \u00b7 blocked: ' + Array.from(blocked).join(',') : '');
  }
  let failCount = 0;
  let okTimer = null;
  function savedPill() {
    let el = document.getElementById('sync-ok');
    if (!el) {
      el = document.createElement('div'); el.id = 'sync-ok'; el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:12px;z-index:9000;background:var(--ink);color:var(--bg);font:600 12px/1 var(--text);padding:6px 10px;border-radius:999px;pointer-events:none';
      document.body.appendChild(el);
    }
    el.textContent = 'Saved \u2713'; el.hidden = false; chip('saved ' + new Date().toLocaleTimeString());
    clearTimeout(okTimer); okTimer = setTimeout(() => { el.hidden = true; }, 1800);
  }
  function syncErr(e) {
    let bar = document.getElementById('sync-warn');
    if (!e) { if (bar) bar.hidden = true; return; }
    const msg = typeof e === 'string' ? e : ((e.code === 'permission-denied' || /permission/i.test(e.message || '')) ? 'Firestore rules are blocking this app.' : (e.message || String(e)).slice(0, 120));
    if (!bar) {
      bar = document.createElement('div'); bar.id = 'sync-warn'; bar.setAttribute('role', 'alert');
      bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:9000;max-width:406px;margin:0 auto;background:var(--red);color:#fff;border:2px solid var(--edge);border-radius:14px;padding:10px 14px;font:600 13px/1.4 var(--text);box-shadow:var(--sh-sm)';
      document.body.appendChild(bar);
    }
    bar.textContent = (blocked.size ? 'Some data is NOT being saved. ' : 'Changes are NOT being saved. ') + msg; bar.hidden = false;
    chip('ERROR ' + String((e && e.code) || msg).slice(0, 40));
  }

  // ---- images live in their own docs so posts stay under Firestore's 1 MB doc limit ----
  const enc = async val => {
    const fresh = [];
    const s = JSON.stringify(val, (k, v) => {
      if (typeof v === 'string' && v.indexOf('data:') === 0 && v.length > 20000) {
        let id = urlId.get(v);
        if (!id) { id = 'im' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); urlId.set(v, id); imgs.set(id, v); fresh.push([id, v]); }
        return 'fbimg:' + id;
      }
      return v;
    });
    for (const [id, v] of fresh) await db.collection('images').doc(id).set({ d: v });
    return s;
  };
  const dec = s => JSON.parse(s, (k, v) => (typeof v === 'string' && v.indexOf('fbimg:') === 0 && imgs.has(v.slice(6))) ? imgs.get(v.slice(6)) : v);

  // ---- local -> cloud ----
  const localEntries = c => isList(c) ? store[c].map(x => [x.id, x]) : Object.entries(store[c]);
  const sentAll = {}, lastSent = {}; // echoes of our own older saves must not overwrite newer local edits
  async function put(c, id, val) {
    try {
      const d = await enc(val), k = c + '/' + id;
      (sentAll[k] = sentAll[k] || new Set()).add(d); lastSent[k] = d;
      await db.collection(c).doc(id).set({ d });
    }

  }

  async function flush() {
    if (!ready) { chip('NOT READY ' + seen.size + '/' + ALL.length + ' - change not saved'); return; }

    const f0 = failCount;
    try {
      const jobs = [];
      for (const c of LISTS.concat(MAPS)) {

          cur[id] = 1; const j = JSON.stringify(v);

      }

      await Promise.all(jobs);
      if (failCount === f0) { if (!blocked.size) syncErr(null); if (jobs.length) savedPill(); }
    } finally { flushing = false; if (again) { again = false; schedule(); } }
  }

  window.syncNow = async () => {
    clearTimeout(timer);
